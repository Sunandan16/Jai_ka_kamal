<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel — CAM-LDS Cybersecurity RCA Engine</title>
<style>
  :root {
    --blue-900: #0b1f4b;
    --blue-800: #0c2a63;
    --blue-700: #1d4ed8;
    --blue-600: #2563eb;
    --blue-500: #3b82f6;
    --blue-400: #60a5fa;
    --blue-200: #bfdbfe;
    --blue-100: #dbeafe;
    --blue-50:  #eff6ff;
    --page-bg:  #f4f8ff;
    --ink:      #0f1f3d;
    --ink-soft: #475569;
    --ink-faint:#64748b;
    --line:     #dbeafe;
    --white:    #ffffff;
    --danger:   #b91c1c;
    --danger-bg:#fef2f2;
    --radius:   14px;
    --shadow:   0 1px 2px rgba(15, 31, 61, .06), 0 8px 24px rgba(37, 99, 235, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: linear-gradient(180deg, var(--blue-900) 0%, var(--blue-800) 100%);
    color: #dbeafe;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 20px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; border-bottom: 1px solid rgba(219,234,254,.15); }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--blue-400), var(--blue-600));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: 0 4px 14px rgba(96,165,250,.45);
  }
  .brand h1 { font-size: 17px; color: #fff; letter-spacing: .2px; }
  .brand small { display: block; font-size: 10.5px; color: #93c5fd; letter-spacing: .4px; }
  .side-title {
    margin: 18px 8px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; color: #7ca9e8;
  }
  .side-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 10px; cursor: pointer; color: #dbeafe;
    transition: background .15s, color .15s;
    margin-bottom: 2px;
  }
  .side-item:hover { background: rgba(255,255,255,.08); }
  .side-item.active { background: var(--blue-600); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.4); }
  .side-item .name { font-weight: 600; font-size: 13px; }
  .side-item .sub { display: block; font-size: 10.5px; color: #9dbef0; font-weight: 400; }
  .side-item.active .sub { color: #dbeafe; }
  .chip { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .chip.done     { background: rgba(96,165,250,.25); color: #bfdbfe; }
  .chip.active-p { background: var(--blue-500); color: #fff; }
  .chip.pending  { background: rgba(255,255,255,.1); color: #8fb3e4; }
  .side-footer { margin-top: auto; padding: 14px 8px 4px; border-top: 1px solid rgba(219,234,254,.15); font-size: 11px; color: #7ca9e8; }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    background: var(--white); border-bottom: 1px solid var(--line);
    padding: 16px 28px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h2 { font-size: 18px; color: var(--blue-900); }
  .topbar .scenario-id { font-size: 11px; color: var(--ink-faint); font-family: Consolas, monospace; background: var(--blue-50); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .topbar .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--blue-200); background: var(--white); color: var(--blue-700);
    padding: 7px 14px; border-radius: 9px; font-weight: 600; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: var(--blue-50); border-color: var(--blue-400); }
  .btn.primary { background: var(--blue-600); border-color: var(--blue-600); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
  .btn.primary:hover { background: var(--blue-700); }

  .content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; width: 100%; margin: 0 auto; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 20px;
  }
  .card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--blue-700);
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .card h3 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-500); display: inline-block; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .stat {
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; border-left: 4px solid var(--blue-500);
  }
  .stat .num { font-size: 24px; font-weight: 800; color: var(--blue-900); line-height: 1.2; }
  .stat .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }

  /* Root cause banner */
  .root-cause {
    background: linear-gradient(135deg, #ffffff 0%, var(--blue-50) 100%);
    border: 1px solid var(--blue-200); border-left: 6px solid var(--blue-600);
  }
  .root-cause .rc-label { font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px; color: var(--blue-700); text-transform: uppercase; }
  .root-cause p { font-size: 15.5px; color: var(--ink); margin-top: 6px; }
  .mitre-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .mitre-badge {
    font-size: 10.5px; font-weight: 700; background: var(--white); color: var(--blue-700);
    border: 1px solid var(--blue-200); padding: 3px 9px; border-radius: 999px;
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; } .sidebar { position: static; height: auto; } }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--blue-200); }
  .tl-item { position: relative; padding: 0 0 14px 10px; }
  .tl-item::before {
    content: ""; position: absolute; left: -20px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--white); border: 3px solid var(--blue-500);
  }
  .tl-item.susp::before { border-color: #1e40af; background: var(--blue-100); }
  .tl-time { font-family: Consolas, monospace; font-size: 12px; color: var(--blue-700); font-weight: 700; }
  .tl-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .tl-detail { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .tl-src { display: inline-block; font-size: 10px; color: var(--ink-faint); background: var(--blue-50); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; margin-top: 4px; }

  /* ---------- Hypotheses ---------- */
  .hyp { border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; background: var(--white); }
  .hyp.top { border-color: var(--blue-500); box-shadow: 0 0 0 3px var(--blue-100); }
  .hyp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hyp-name { font-weight: 700; font-size: 13.5px; }
  .hyp-rank { font-size: 10px; font-weight: 800; color: var(--blue-700); background: var(--blue-50); border: 1px solid var(--blue-200); padding: 2px 8px; border-radius: 999px; }
  .hyp-why { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .conf-wrap { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .conf-bar { flex: 1; height: 8px; background: var(--blue-100); border-radius: 999px; overflow: hidden; }
  .conf-fill { height: 100%; background: linear-gradient(90deg, var(--blue-500), var(--blue-700)); border-radius: 999px; }
  .conf-val { font-weight: 800; font-size: 13px; color: var(--blue-800); min-width: 44px; text-align: right; }

  /* ---------- Attack chain ---------- */
  .graph-wrap { overflow-x: auto; }
  #graph { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; row-gap: 16px; padding: 6px 0; }
  .cnode {
    background: var(--white); border: 1.5px solid var(--blue-400); border-radius: 12px;
    padding: 9px 16px; text-align: center; min-width: 120px;
    box-shadow: 0 2px 10px rgba(37, 99, 235, .10);
  }
  .cnode .ctype { display: block; font-size: 9px; font-weight: 800; letter-spacing: 1.4px; color: var(--blue-600); text-transform: uppercase; }
  .cnode .clabel { display: block; font-weight: 700; color: var(--blue-900); font-size: 13.5px; margin-top: 1px; }
  .cnode .csub { display: block; font-size: 10.5px; color: var(--ink-faint); }
  .connector { display: flex; flex-direction: column; align-items: center; padding: 0 10px; min-width: 100px; }
  .connector .rel {
    font-size: 9.5px; font-weight: 700; color: var(--blue-700); background: var(--blue-50);
    border: 1px solid var(--blue-200); padding: 1px 9px; border-radius: 999px; white-space: nowrap;
  }
  .connector .dashes { display: flex; align-items: center; gap: 6px; color: var(--blue-400); font-size: 16px; font-weight: 800; letter-spacing: 2px; line-height: 1; margin-top: 4px; }
  .connector .arrow { color: var(--blue-600); }

  /* ---------- Table ---------- */
  .table-tools { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 180px; border: 1px solid var(--blue-200); border-radius: 9px;
    padding: 8px 12px; font-size: 13px; color: var(--ink); outline: none; background: var(--white);
  }
  .search:focus { border-color: var(--blue-500); box-shadow: 0 0 0 3px var(--blue-100); }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--ink-faint); border-bottom: 2px solid var(--blue-100); padding: 8px 10px; white-space: nowrap;
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--blue-50); font-size: 12.5px; vertical-align: top; }
  tbody tr:hover { background: var(--blue-50); }
  tr.susp-row { background: #f8fbff; }
  tr.susp-row td:first-child { box-shadow: inset 3px 0 0 var(--blue-600); }
  .t-time { font-family: Consolas, monospace; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .t-src { font-size: 11px; color: var(--blue-700); font-weight: 600; white-space: nowrap; }
  .t-type { display: inline-block; font-size: 10.5px; background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .flag { display: inline-block; font-size: 10px; font-weight: 800; color: #fff; background: var(--blue-700); padding: 1px 7px; border-radius: 999px; }

  .empty { padding: 30px; text-align: center; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Sentinel</h1>

      </div>

  <!-- ================= MAIN ================= -->

    <div class="content">

      <div class="two-col">

        <div class="card">

      <div class="card">

            <input type="checkbox" id="suspOnly" onchange="renderTable()" /> Suspicious only

        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Time</th><th>Source</th><th>Type</th><th>Summary</th><th>Host</th><th>IP</th><th>MITRE</th><th></th>
              </tr>
            </thead>
            <tbody id="eventsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Scenario data (mirrors verified scenarios in project_handoff.json)

const PIPELINE = [

  {

      { from: "n2", to: "n3", relation: "configured",          reason: "nextcloud.log: workflow created by alice",                    confidence: 0.90 },
      { from: "n3", to: "n4", relation: "executed",            reason: "Workflow command runs curl; audit confirms sh → curl",        confidence: 0.92 },
      { from: "n4", to: "n5", relation: "downloaded_then_executed", reason: "curl downloads rJZMoLeJ, chmod +x, then executes",       confidence: 0.88 },

let current = SCENARIOS[0];

/* ============================================================
   Sidebar rendering
   ============================================================ */
function renderSidebar() {
  const sList = document.getElementById("scenarioList");
  sList.innerHTML = SCENARIOS.map((s, i) => `
    <div class="side-item ${s === current ? "active" : ""}" onclick="selectScenario(${i})">
      <div>
        <div class="name">${s.title}</div>
        <div class="sub">${s.id} · ${s.events} events</div>
      </div>
      <span class="chip ${s === current ? "active-p" : ""}">${s.events}</span>
    </div>`).join("");

  const pList = document.getElementById("stageList");
  pList.innerHTML = PIPELINE.map(p => {
    const chip = p.status === "done" ? '<span class="chip done">DONE</span>'
               : p.status === "active" ? '<span class="chip active-p">ACTIVE</span>'
               : '<span class="chip pending">PENDING</span>';
    return `<div class="side-item"><span class="name" style="font-weight:500">${p.name}</span>${chip}</div>`;
  }).join("");
}

function selectScenario(i) {
  current = SCENARIOS[i];
  document.getElementById("searchBox").value = "";
  document.getElementById("suspOnly").checked = false;
  renderSidebar();
  renderAll();
}

/* ============================================================
   Main rendering
   ============================================================ */
function renderAll() {
  document.getElementById("scenarioTitle").textContent = current.title;
  document.getElementById("scenarioId").textContent = current.id;

  // Stats
  const entities = current.chain.length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${current.events}</div><div class="lbl">Defender Events</div></div>
    <div class="stat"><div class="num">${current.sources.length}</div><div class="lbl">Log Sources</div></div>
    <div class="stat"><div class="num">${entities}</div><div class="lbl">Graph Entities</div></div>
    <div class="stat"><div class="num">${Math.round(current.hypotheses[0].conf * 100)}%</div><div class="lbl">Top Confidence</div></div>
    <div class="stat"><div class="num">0</div><div class="lbl">Attacker Files Used</div></div>`;

  // Root cause
  document.getElementById("rootCauseText").textContent = current.rootCause;
  document.getElementById("mitreBadges").innerHTML =
    current.mitre.map(m => `<span class="mitre-badge">${m}</span>`).join("");

  // Timeline
  document.getElementById("timeline").innerHTML = current.timeline.map(t => `
    <div class="tl-item ${t.susp ? "susp" : ""}">
      <div class="tl-time">${t.t}</div>
      <div class="tl-title">${t.title}</div>
      <div class="tl-detail">${t.detail}</div>
      <span class="tl-src">${t.src}</span>
    </div>`).join("");

  // Hypotheses
  document.getElementById("hypotheses").innerHTML = current.hypotheses.map((h, i) => `
    <div class="hyp ${h.top ? "top" : ""}">
      <div class="hyp-head">
        <div class="hyp-name">${h.name}</div>
        <span class="hyp-rank">#${i + 1}${h.top ? " · LEAD" : ""}</span>
      </div>
      <div class="hyp-why">${h.why}</div>
      <div class="conf-wrap">
        <div class="conf-bar"><div class="conf-fill" style="width:${Math.round(h.conf * 100)}%"></div></div>
        <div class="conf-val">${Math.round(h.conf * 100)}%</div>
      </div>
    </div>`).join("");

  renderChain();
  renderTable();
}

/* ============================================================
   Graph (SVG)
   ============================================================ */
function renderChain() {
  let html = "";
  current.chain.forEach((n, i) => {
    html += `
      <div class="cnode" title="${n.type} · ${n.label}">
        <span class="ctype">${n.type}</span>
        <span class="clabel">${n.label}</span>
        <span class="csub">${n.sub}</span>
      </div>`;
    if (i < current.chain.length - 1) {
      const e = current.edges[i] || { relation: "---", reason: "", confidence: 0 };
      html += `
        <div class="connector" title="${e.reason} · confidence ${Math.round((e.confidence || 0) * 100)}%">
          <span class="rel">${e.relation}</span>
          <span class="dashes">- - - -<span class="arrow">›</span></span>
        </div>`;
    }
  });
  document.getElementById("graph").innerHTML = html;
}

/* ============================================================
   Events table
   ============================================================ */
function renderTable() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const suspOnly = document.getElementById("suspOnly").checked;
  const rows = current.events.filter(ev => {
    if (suspOnly && !ev.susp) return false;
    if (!q) return true;
    return [ev.t, ev.src, ev.type, ev.summary, ev.host, ev.ip, ev.mitre].join(" ").toLowerCase().includes(q);
  });

  document.getElementById("eventsBody").innerHTML = rows.length
    ? rows.map(ev => `
      <tr class="${ev.susp ? "susp-row" : ""}">
        <td class="t-time">${ev.t}</td>
        <td class="t-src">${ev.src}</td>
        <td><span class="t-type">${ev.type}</span></td>
        <td>${ev.summary}</td>
        <td>${ev.host}</td>
        <td class="t-time">${ev.ip}</td>
        <td>${ev.mitre ? `<span class="mitre-badge" style="padding:1px 7px">${ev.mitre}</span>` : ""}</td>
        <td>${ev.susp ? '<span class="flag">SUSP</span>' : ""}</td>
      </tr>`).join("")
    : `<tr><td colspan="8" class="empty">No events match your filter.</td></tr>`;
}

/* ============================================================
   Export helpers
   ============================================================ */
function downloadReport() {
  const lines = [
    `# Sentinel RCA Report — ${current.title}`,
    ``,
    `- Scenario: \`${current.id}\``,
    `- Date: ${current.date}`,
    `- Normalized events: ${current.events} (defender-side only)`,
    ``,
    `## Root Cause`,
    current.rootCause,
    ``,
    `## MITRE ATT&CK`,
    current.mitre.map(m => `- ${m}`).join("\n"),
    ``,
    `## Attack Timeline`,
    current.timeline.map(t => `- \`${t.t}\` **${t.title}** — ${t.detail} (_${t.src}_)`).join("\n"),
    ``,
    `## Hypotheses`,
    current.hypotheses.map((h, i) => `${i + 1}. **${h.name}** — ${Math.round(h.conf * 100)}% confidence\n   ${h.why}`).join("\n"),
    ``,
    `## Investigation Graph`,
    current.edges.map(e => `- \`${e.from}\` → \`${e.to}\` (${e.relation}, ${Math.round(e.conf * 100)}%) — ${e.reason}`).join("\n"),
    ``,
    `---`,
    `_Generated by Sentinel — explainable, evidence-backed RCA._`,
  ].join("\n");
  saveBlob(lines, `${current.id.replace(/\//g, "_")}_rca_report.md`, "text/markdown");
}

function downloadGraph() {
  const payload = {
    scenario: current.id,
    generated: new Date().toISOString(),
    entities: current.chain.map(n => ({ id: n.id, type: n.type, label: n.label, detail: n.sub })),
    edges: current.edges,
  };
  saveBlob(JSON.stringify(payload, null, 2), `${current.id.replace(/\//g, "_")}_investigation_graph.json`, "application/json");
}

function saveBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   Boot
   ============================================================ */
renderSidebar();
renderAll();
